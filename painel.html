<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Oração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
  <div id="stage">
    <header class="board-head">
      <div class="title">
        <div class="logo">ONE VOICE <span>27</span></div>
        <div class="subtitle">Turnos de Oração</div>
      </div>
      <div class="clock">
        <div id="clock-time">--:--<small>:--</small></div>
        <div id="clock-date"></div>
      </div>
    </header>

    <div class="cols">
      <div>Início</div><div>Término</div><div>Participante 1</div><div>Campo</div>
      <div>Participante 2</div><div>Campo</div><div>Situação</div>
    </div>

    <div id="rows" class="rows"></div>

    <footer class="board-foot">
      <div id="status"><span class="dot"></span><span id="status-text">Conectando…</span></div>
      <div class="legend">
        <span><i class="lg live"></i>Em oração</span>
        <span><i class="lg soon"></i>Em breve</span>
        <span><i class="lg sched"></i>Agendado</span>
      </div>
      <div id="page"></div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
